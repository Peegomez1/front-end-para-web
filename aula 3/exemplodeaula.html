<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de link</title>
</head>
<body>
    <h1> Exemplo de link e imagem</h1>
    <br/>

    <p>Acesse o site por meio de link</p>

    >   
        visitar o site da Google
    </a>

    <h2>Imagem do projeto</h2>
    <br/>
    <img 
        src="img/images.jpg" 
        alt="foto do front end"
        width="300"
    />
    

</body>
</html>
