<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Exemplo div com css</title>


    <style>
      div {
        font: size 28px;
        text-align: center;
        padding: 20px;
        margin: 20px;
        border: radius 10px;
      }
    #principal{
        background-color:red;
        border:3px solid black;
        color:aliceblue white;


    }
    #secundaria{
        background-color: black;
        border: 3px solid blueviolet;
        color:red;
    }
   hr{
     border: none;
     border-top: 3px solid gray;
     width: 80%;

   }
       
    </style>
</head>
<body>
    <div id="principal">
         Esta é a primeira linha.
         <br>
         Esata é a segunda linha.
    </div>
    <hr/>
     <div id="secundaria">
          Esta é outra divisão de pagina.
          <br>
          aqui começa uma nova linha
     </div>
</body>
</html>
