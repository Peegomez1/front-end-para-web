<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplos de classes e CSS interno</title>
    <style>
        .titulo{
          color: darkred;
          text-align: center;

        }
        .caixa01{
           background-color: rgb(246, 246, 247);
           border: 5px solid black;
           padding: 20px;
           margin: 20px;
        }
        .caixa02{
            background-color:darkred;
            border: 5px solid black;
            padding: 40px;
            margin: 20px;
        }
        
        .destaque01{
            color: rgb(143, 5, 5);
            font-weight: bold;
        }
        .destaque02{
            color: rgb(124, 8, 8);
            background-color: rgb(13, 13, 14);
            font-style: italic;
            padding: 10px;
        }

    </style>




</head>
<body>
    <h1 class="titulo">Aprendendo classes em CSS</h1>
     <div class="caixa01">
        <p>
            Estou aprendendo a utilizar classes para personalzar 
            os elementos de uma pagina.
        </p>
        <br>
        <p class="destaque01">
            Este paragrafo utiliza a classe destaque01.
        </p>
        <p class="destaque02">
           Este paragrafo utiliza a classe destaque02

        </p>
    </div>
    <div class="caixa02">
       <p>Este paragrafo não utiliza nenhuma classe</p>

    </div>


</body>
</html>
